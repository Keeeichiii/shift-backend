spring.application.name=shift-backend

# Порт: локально 8090; на Railway и др. PaaS задайте PORT — см. ${PORT:8090}.
# SERVER_PORT и -Dserver.port=... по-прежнему перекрывают это значение.
server.port=${PORT:8090}

# Два процесса подряд (двойной Run или DevTools) часто дают «port already in use» на том же порту.
spring.devtools.restart.enabled=false

# На Railway задайте SPRING_DATASOURCE_* (или ссылки на Postgres). Иначе — локальный Postgres.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shift_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1221}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Каталог для фото карточек машин (раздаётся как /uploads/vehicle-cards/…)
app.vehicle-card-upload.dir=${user.home}/.shift-backend/vehicle-card-uploads

# Необязательно: абсолютный путь к …/static/images/cars (если пусто — при наличии src/main/resources/static/images/cars).
# Раздаётся как /images/cars/**. В Docker задайте APP_VEHICLE_CARD_BUNDLED_CARS_ROOT и смонтируйте том (см. docker-compose.yml).
# app.vehicle-card-bundled-cars.root=
